# Local PostgreSQL for Prometheus backend development.
#
# Module 00 provides connectivity only - the schema and migrations arrive with
# Module 01 (Database Foundation).
#
# Usage:
#   docker compose up -d      # start
#   docker compose down       # stop (keeps data)
#   docker compose down -v    # stop and delete the volume
#
# Note: if a container named `prometheus-postgres` already exists (for example
# created manually), Docker will refuse to create a second one. Start the
# existing container directly instead:  docker start prometheus-postgres
services:
  postgres:
    image: postgres:16-alpine
    container_name: prometheus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-prometheus}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-prometheus_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-prometheus}
      # Deterministic collation keeps index behaviour identical across machines.
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - prometheus-pgdata:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-prometheus} -d ${POSTGRES_DB:-prometheus}',
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  prometheus-pgdata: